<!doctype html><html><head><meta charset="utf-8"><title>Print {{ asset.asset_id }} QR label</title><style>body{font:16px Arial,sans-serif;color:#172033;display:grid;place-items:center;min-height:100vh}.label{width:300px;border:1px solid #d9deea;border-radius:16px;padding:24px;text-align:center}.label img{width:220px;height:220px}.label h1{font-size:19px;margin:10px 0 4px}.label p{font-size:12px;color:#667085;margin:0}.print{margin-top:20px;padding:10px 20px}@media print{.print{display:none}.label{border:0}}</style></head><body><div class="label"><img src="{{ url_for('assets.qr_image', asset_id=asset.asset_id) }}" alt="QR code"><h1>{{ asset.name }}</h1><p>{{ asset.asset_id }} · {{ asset.serial_number }}</p><button class="print" onclick="window.print()">Print label</button></div></body></html>
