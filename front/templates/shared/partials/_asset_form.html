<div class="form-section"><div class="form-section-title"><span class="section-number">01</span><div><h3>Asset information</h3><p>Identify this item in your inventory.</p></div></div><div class="form-grid"><div class="field full"><label>Asset name <sup>*</sup></label><input name="name" required maxlength="140" placeholder="e.g. Dell Latitude 5440" value="{{ value('name') }}"></div><div class="field"><label>Category <sup>*</sup></label><select name="category" required><option value="">Select category</option>{% for x in CATEGORIES %}<option {% if value('category')==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div><div class="field"><label>Serial number <sup>*</sup></label><input name="serial_number" required maxlength="100" placeholder="Manufacturer serial number" value="{{ value('serial_number') }}"></div></div></div>
<div class="form-section"><div class="form-section-title"><span class="section-number">02</span><div><h3>Assignment & location</h3><p>Where it lives and who is responsible for it.</p></div></div><div class="form-grid"><div class="field"><label>Department <sup>*</sup></label><select name="department" required><option value="">Select department</option>{% for x in DEPARTMENTS %}<option {% if value('department')==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div><div class="field"><label>Location <sup>*</sup></label><input name="location" required maxlength="140" list="location-options" placeholder="Building, room or area" value="{{ value('location') }}"><datalist id="location-options">{% for x in LOCATIONS %}<option value="{{ x }}">{% endfor %}</datalist></div><div class="field"><label for="assetAssignedTo">Assigned to <sup>*</sup></label><input id="assetAssignedTo" name="assigned_to" required maxlength="120" placeholder="Staff member or team" value="{{ value('assigned_to') }}"><small class="field-help" id="retiredAssignmentNotice" hidden>Retired assets are unassigned and cannot be allocated to a person or team.</small></div><div class="field"><label>Purchase date <sup>*</sup></label><input type="date" name="purchase_date" max="{{ today }}" required value="{{ value('purchase_date') }}"></div></div></div>
<div class="form-section"><div class="form-section-title"><span class="section-number">03</span><div><h3>Condition & notes</h3><p>Keep the current record accurate.</p></div></div><div class="form-grid"><div class="field"><label for="assetStatus">Status <sup>*</sup></label><select id="assetStatus" name="status" required>{% for x in STATUSES %}<option {% if value('status', 'Active')==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div><div class="field full"><label>Description <span class="optional">OPTIONAL</span></label><textarea name="description" rows="3" maxlength="1000" placeholder="Model, condition, or other useful details…">{{ value('description') }}</textarea></div></div></div>
